services:
  app:
    build: .
    container_name: khatbar-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://khatbar:khatbar@db:5432/khatbar
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_GIPHY_API_KEY: ${NEXT_PUBLIC_GIPHY_API_KEY:-}
      NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

  db:
    image: postgres:16-alpine
    container_name: khatbar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: khatbar
      POSTGRES_PASSWORD: khatbar
      POSTGRES_DB: khatbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khatbar -d khatbar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
  uploads:
